apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-learning-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-learning-lab
  template:
    metadata:
      labels:
        app: llm-learning-lab
    spec:
      containers:
        - name: app
          image: llm-learning-lab:latest
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: llm-learning-lab-service
spec:
  selector:
    app: llm-learning-lab
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: ClusterIP
